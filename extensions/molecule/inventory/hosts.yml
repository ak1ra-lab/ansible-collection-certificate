---
# Supported managed nodes for every container-backed Molecule scenario.
#
# The certificate roles are Debian-only by contract (certbot apt installs,
# cert-manager manifests, acme-dns systemd units), so the supported matrix is
# Debian 12/13.
#
# ansible_host must be a literal template that does not depend on
# inventory_hostname: delegated connection variables are resolved in the
# delegating host's context (localhost).  The scenario name and a stable hash
# of the checkout keep container names isolated across scenarios and parallel
# checkouts.
#
# Images are tracked by tag.  Pin them by digest in the consumer repository if
# reproducible image pulls are required.

all:
  children:
    test_resources:
      hosts:
        debian-12:
          ansible_host: >-
            molecule-cert-{{ lookup('env', 'MOLECULE_SCENARIO_NAME') }}-{{ (lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | to_uuid)[:8] }}-debian-12
          container_image: ghcr.io/ak1ra-lab/docker-systemd/debian:12
        debian-13:
          ansible_host: >-
            molecule-cert-{{ lookup('env', 'MOLECULE_SCENARIO_NAME') }}-{{ (lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | to_uuid)[:8] }}-debian-13
          container_image: ghcr.io/ak1ra-lab/docker-systemd/debian:13
