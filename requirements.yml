---
# Runtime collection dependencies for an ansible-builder execution
# environment. ak1ra_lab.general is declared in galaxy.yml as well so an
# execution environment built from this file resolves the same dependency.
# Test-only collections shared by ansible-lint and the test harness live in
# tests/requirements.yml.
collections:
  - name: ak1ra_lab.general
    version: ">=0.4.0"
  - name: community.general
    version: ">=8.0.0"
  - name: kubernetes.core
    version: ">=6.0.0"
