[ansible]
# The collection supports ansible-core 2.19-2.21 and Python 3.11+. Keep the
# tox-ansible matrix on supported combinations only; WP-5 owns the full CI
# matrix and weekly devel/milestone runs.
skip =
    py3.7
    py3.8
    py3.9
    py3.10
    2.9
    2.10
    2.11
    2.12
    2.13
    2.14
    2.15
    2.16
    2.17
    2.18
