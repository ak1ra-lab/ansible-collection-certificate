---
- name: validate the role inputs
  ansible.builtin.import_tasks: validate.yml

- name: install certbot
  ansible.builtin.import_tasks: install.yml

- name: configure DNS credentials
  ansible.builtin.import_tasks: dns_credentials.yml

- name: configure renewal hooks and log rotation
  ansible.builtin.import_tasks: renewal.yml

- name: obtain certificates
  ansible.builtin.import_tasks: certificates.yml

- name: configure the renewal timer
  ansible.builtin.import_tasks: service.yml
